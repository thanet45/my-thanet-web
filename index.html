<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดูดวงแม่นยำระดับโปร | โชคชะตาของคุณ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-color: #00f3ff;
            --bg-color: #0d0d12;
            --card-bg: rgba(20, 20, 30, 0.7);
        }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1a1a3a 0%, var(--bg-color) 70%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: var(--neon-color);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, button {
            font-family: 'Kanit', sans-serif;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }
        input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        /* ปรับไอคอนปฏิทินให้เป็นสีขาว */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        input:focus, select:focus {
            border-color: var(--neon-color);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.3);
        }
        button.primary-btn {
            background: linear-gradient(90deg, #0052d4, #4364f7, #6fb1fc);
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 20px;
        }
        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(111, 177, 252, 0.4);
        }
        #result-card {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border-left: 4px solid var(--neon-color);
            text-align: left;
            animation: fadeIn 0.5s ease;
        }
        .share-btn {
            background: transparent;
            border: 1px solid var(--neon-color);
            color: var(--neon-color);
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .share-btn:hover {
            background: var(--neon-color);
            color: #000;
        }
        
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--neon-color);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ ศาสตร์แห่งดวงดาว</h1>
        <p style="color: #aaa; font-size: 14px;">กรอกข้อมูลเพื่อรับคำทำนายเฉพาะคุณ</p>
        
        <input type="text" id="user-name" placeholder="ชื่อ - นามสกุล" autocomplete="off">
        <input type="date" id="user-dob" title="วันเดือนปีเกิด">
        
        <select id="category-select">
            <option value="" disabled selected>-- เลือกเรื่องที่ต้องการดูดวง --</option>
            <option value="การงาน">💼 ด้านการงาน</option>
            <option value="การเงิน">💰 ด้านการเงิน</option>
            <option value="ความรัก">❤️ ด้านความรัก / เนื้อคู่</option>
            <option value="ทั่วไป">✨ ภาพรวมทั่วไป</option>
        </select>
        
        <button class="primary-btn" onclick="predict()">เริ่มต้นอ่านคำทำนาย</button>
        
        <div class="loader" id="loader"></div>
        
        <div id="result-card">
            <h3 style="margin-top: 0; color: var(--neon-color);" id="result-title"></h3>
            <div id="result-text" style="font-size: 16px; line-height: 1.6;"></div>
            <button class="share-btn" onclick="shareResult()">📤 แชร์คำทำนาย</button>
        </div>
    </div>

    <script>
        // ชุดคำทำนายแบ่งตามหมวดหมู่ สามารถเข้าไปแก้หรือเพิ่มข้อความในเครื่องหมายคำพูดได้เลย
        const fortunes = {
            "การงาน": [
                "โปรเจกต์หรือชิ้นงานที่คุณกำลังทำอยู่จะประสบความสำเร็จอย่างงดงาม เจ้านายหรือผู้ใหญ่เล็งเห็นความสามารถ",
                "ช่วงนี้อาจมีเรื่องให้ต้องเหนื่อยกับการแก้ปัญหาเฉพาะหน้า แต่คุณจะผ่านมันไปได้ด้วยดี",
                "มีเกณฑ์ได้รับการติดต่อเรื่องงานใหม่ๆ หรือการโยกย้ายตำแหน่งไปในทิศทางที่ดีขึ้น",
                "ระวังปัญหาการสื่อสารกับเพื่อนร่วมงาน ควรใจเย็นและรับฟังเหตุผลของผู้อื่นให้มาก"
            ],
            "การเงิน": [
                "การเงินโดดเด่นมาก มีโอกาสได้รับโชคลาภจากการเสี่ยงดวงหรือเงินก้อนโตแบบไม่คาดฝัน",
                "ช่วงนี้สภาพคล่องอาจติดขัดเล็กน้อย ควรระมัดระวังการใช้จ่ายในสิ่งที่ไม่จำเป็น",
                "การลงทุนในช่วงนี้จะได้รับผลตอบแทนที่ดี แต่ควรศึกษาข้อมูลให้รอบคอบก่อนตัดสินใจ",
                "จะมีคนใกล้ตัวเข้ามาขอความช่วยเหลือเรื่องหยิบยืมเงิน ควรพิจารณาให้ดีก่อนช่วยเหลือ"
            ],
            "ความรัก": [
                "คนโสดมีเกณฑ์พบคนที่ถูกใจจากการเดินทางหรือหน้าที่การงาน เป็นความสัมพันธ์ที่ค่อยๆ พัฒนา",
                "คนมีคู่ ความรักสุกงอม มีความเข้าใจกันมากขึ้น บางคู่มีเกณฑ์ลั่นระฆังวิวาห์",
                "ช่วงนี้อาจมีเรื่องให้พ่อแง่แม่งอนกันบ่อย ควรใช้เหตุผลมากกว่าอารมณ์ในการพูดคุย",
                "เสน่ห์แรงเป็นพิเศษสำหรับคนโสด มีคนเข้ามาให้เลือกทำความรู้จักมากกว่าหนึ่งคน"
            ],
            "ทั่วไป": [
                "วันนี้เป็นวันของคุณ ทำอะไรก็ราบรื่นและได้รับการสนับสนุนจากคนรอบข้าง",
                "สุขภาพช่วงนี้ต้องระวังเป็นพิเศษ พักผ่อนให้เพียงพอและดื่มน้ำเยอะๆ",
                "จังหวะชีวิตกำลังขาขึ้น อุปสรรคที่เคยมีจะค่อยๆ คลี่คลายไปในทางที่ดี",
                "จะมีโชคจากคนแปลกหน้า หรือได้รับโอกาสดีๆ จากการเข้าไปอยู่ในสังคมใหม่ๆ"
            ]
        };

        function predict() {
            const name = document.getElementById('user-name').value.trim();
            const dob = document.getElementById('user-dob').value;
            const category = document.getElementById('category-select').value;
            
            // เช็คว่ากรอกข้อมูลครบหรือไม่
            if(!name || !dob || !category) {
                alert("กรุณากรอกข้อมูล ชื่อ, วันเกิด และเลือกเรื่องที่ต้องการดูดวงให้ครบถ้วนครับ");
                return;
            }

            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('result-card');
            
            resultCard.style.display = 'none';
            loader.style.display = 'block';
            
            setTimeout(() => {
                loader.style.display = 'none';
                
                // สุ่มคำทำนายจากหมวดหมู่ที่เลือก
                const categoryFortunes = fortunes[category];
                const randomIndex = Math.floor(Math.random() * categoryFortunes.length);
                const fortuneText = categoryFortunes[randomIndex];
                
                // แสดงผลลัพธ์
                document.getElementById('result-title').innerText = `ดวง${category} ของคุณ ${name}`;
                document.getElementById('result-text').innerHTML = `
                    <p style="color: #ccc; font-size: 14px; margin-top: -10px; margin-bottom: 15px;">
                        วันที่เกิด: ${formatDate(dob)}
                    </p>
                    ${fortuneText}
                `;
                
                resultCard.style.display = 'block';
            }, 1500); 
        }

        // ฟังก์ชันแปลงรูปแบบวันที่ให้สวยงาม (YYYY-MM-DD -> DD/MM/YYYY)
        function formatDate(dateString) {
            const parts = dateString.split('-');
            const year = parseInt(parts[0]) + 543; // แปลงเป็น พ.ศ.
            return `${parts[2]}/${parts[1]}/${year}`;
        }

        async function shareResult() {
            const title = document.getElementById('result-title').innerText;
            const textContent = document.getElementById('result-text').innerText;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'คำทำนายของฉัน',
                        text: `${title}\n\n${textContent}\n\nมาเช็คดวงของคุณบ้างสิ!`,
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Share canceled or failed', err);
                }
            } else {
                navigator.clipboard.writeText(`${title}\n\n${textContent}\n\n${window.location.href}`);
                alert("คัดลอกคำทำนายเรียบร้อยแล้ว! นำไปส่งในแชทได้เลย");
            }
        }
    </script>
</body>
</html>
