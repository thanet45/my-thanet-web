<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดูดวงแม่นยำระดับโปร | โชคชะตาของคุณ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-color: #00f3ff;
            --bg-color: #05050a;
            --card-bg: rgba(10, 15, 25, 0.85); 
        }
        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg-color);
            /* ใช้รูปภาพจักรวาล ดวงดาว ที่รองรับการแสดงผล 100% */
            background-image: url('https://images.unsplash.com/photo-1532968961962-8a0cb3a2d4f5?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }
        .container {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        h1 {
            color: var(--neon-color);
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select, button {
            font-family: 'Kanit', sans-serif;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        input:focus, select:focus {
            border-color: var(--neon-color);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            background: rgba(0,0,0,0.8);
        }
        button.primary-btn {
            background: linear-gradient(90deg, #0052d4, #4364f7, #6fb1fc);
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
        }
        button.primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(111, 177, 252, 0.6);
        }
        #result-card {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border-radius: 16px;
            border-left: 4px solid var(--neon-color);
            text-align: left;
            animation: fadeIn 0.6s ease;
        }
        .share-btn {
            background: transparent;
            border: 1px solid var(--neon-color);
            color: var(--neon-color);
            margin-top: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .share-btn:hover {
            background: var(--neon-color);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }
        
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--neon-color);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ ศาสตร์แห่งดวงดาว</h1>
        <p style="color: #bbb; font-size: 15px;">กรอกข้อมูลเพื่อเปิดประตูสู่โชคชะตาของคุณ</p>
        
        <input type="text" id="user-name" placeholder="ชื่อ - นามสกุล" autocomplete="off">
        <input type="date" id="user-dob" title="วันเดือนปีเกิด">
        
        <select id="category-select">
            <option value="" disabled selected>-- เลือกเรื่องที่ต้องการดูดวง --</option>
            <option value="การงาน">💼 ดูดวงการงาน</option>
            <option value="การเงิน">💰 ดูดวงการเงิน</option>
            <option value="ความรัก">❤️ ดูดวงความรัก / เนื้อคู่</option>
            <option value="ทั่วไป">✨ ดูดวงภาพรวมทั่วไป</option>
        </select>
        
        <button class="primary-btn" onclick="predict()">ทำนายดวงชะตา</button>
        
        <div class="loader" id="loader"></div>
        
        <div id="result-card">
            <h3 style="margin-top: 0; color: var(--neon-color);" id="result-title"></h3>
            <div id="result-text" style="font-size: 16px; line-height: 1.6;"></div>
            <button class="share-btn" onclick="shareResult()">📤 แชร์คำทำนาย</button>
        </div>
    </div>

    <script>
        const fortunes = {
            "การงาน": [
                "โปรเจกต์หรือชิ้นงานที่คุณกำลังทำอยู่จะประสบความสำเร็จอย่างงดงาม เจ้านายหรือผู้ใหญ่เล็งเห็นความสามารถ",
                "ช่วงนี้อาจมีเรื่องให้ต้องเหนื่อยกับการแก้ปัญหาเฉพาะหน้า แต่คุณจะผ่านมันไปได้ด้วยดี",
                "มีเกณฑ์ได้รับการติดต่อเรื่องงานใหม่ๆ หรือการโยกย้ายตำแหน่งไปในทิศทางที่ดีขึ้น",
                "ระวังปัญหาการสื่อสารกับเพื่อนร่วมงาน ควรใจเย็นและรับฟังเหตุผลของผู้อื่นให้มาก"
            ],
            "การเงิน": [
                "การเงินโดดเด่นมาก มีโอกาสได้รับโชคลาภจากการเสี่ยงดวงหรือเงินก้อนโตแบบไม่คาดฝัน",
                "ช่วงนี้สภาพคล่องอาจติดขัดเล็กน้อย ควรระมัดระวังการใช้จ่ายในสิ่งที่ไม่จำเป็น",
                "การลงทุนในช่วงนี้จะได้รับผลตอบแทนที่ดี แต่ควรศึกษาข้อมูลให้รอบคอบก่อนตัดสินใจ",
                "จะมีคนใกล้ตัวเข้ามาขอความช่วยเหลือเรื่องหยิบยืมเงิน ควรพิจารณาให้ดีก่อนช่วยเหลือ"
            ],
            "ความรัก": [
                "ช่วงเวลานี้หัวใจของคุณกำลังจะได้รับการเยียวยาความเหงาที่สะสมมานานกำลังจะจางหายไปในที่สุดคนที่ใช่จะก้าวเข้ามาในจังหวะชีวิตที่เหมาะสมเขาคนนั้นเป็นคนอบอุ่นและพร้อมจะดูแลคุณอย่างดีสำหรับคนมีคู่"
                ความสัมพันธ์จะยิ่งทวีความหวานมีการพูดคุยถึงเรื่องอนาคตและการสร้างครอบครัวความเข้าใจผิดสารพัดจะคลี่คลายไปในทางที่ดีรักครั้งนี้จะนำพารอยยิ้มและความสุขมาให้คุณ",
               
            ],
            "ทั่วไป": [
                "วันนี้เป็นวันของคุณ ทำอะไรก็ราบรื่นและได้รับการสนับสนุนจากคนรอบข้าง",
                "สุขภาพช่วงนี้ต้องระวังเป็นพิเศษ พักผ่อนให้เพียงพอและดื่มน้ำเยอะๆ",
                "จังหวะชีวิตกำลังขาขึ้น อุปสรรคที่เคยมีจะค่อยๆ คลี่คลายไปในทางที่ดี",
                "จะมีโชคจากคนแปลกหน้า หรือได้รับโอกาสดีๆ จากการเข้าไปอยู่ในสังคมใหม่ๆ"
            ]
        };

        function predict() {
            const name = document.getElementById('user-name').value.trim();
            const dob = document.getElementById('user-dob').value;
            const category = document.getElementById('category-select').value;
            
            if(!name || !dob || !category) {
                alert("กรุณากรอกข้อมูล ชื่อ, วันเกิด และเลือกเรื่องที่ต้องการดูดวงให้ครบถ้วนครับ");
                return;
            }

            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('result-card');
            
            resultCard.style.display = 'none';
            loader.style.display = 'block';
            
            setTimeout(() => {
                loader.style.display = 'none';
                
                const categoryFortunes = fortunes[category];
                const randomIndex = Math.floor(Math.random() * categoryFortunes.length);
                const fortuneText = categoryFortunes[randomIndex];
                
                document.getElementById('result-title').innerText = `ดวง${category} ของคุณ ${name}`;
                document.getElementById('result-text').innerHTML = `
                    <p style="color: rgba(255,255,255,0.7); font-size: 14px; margin-top: -10px; margin-bottom: 15px;">
                        📅 วันที่เกิด: ${formatDate(dob)}
                    </p>
                    ${fortuneText}
                `;
                
                resultCard.style.display = 'block';
            }, 1800); 
        }

        function formatDate(dateString) {
            const parts = dateString.split('-');
            const year = parseInt(parts[0]) + 543;
            return `${parts[2]}/${parts[1]}/${year}`;
        }

        async function shareResult() {
            const title = document.getElementById('result-title').innerText;
            const textContent = document.getElementById('result-text').innerText;
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'คำทำนายของฉัน',
                        text: `${title}\n\n${textContent}\n\nมาเช็คดวงของคุณบ้างสิ! ✨`,
                        url: window.location.href
                    });
                } catch (err) {
                    console.log('Share canceled or failed', err);
                }
            } else {
                navigator.clipboard.writeText(`${title}\n\n${textContent}\n\n${window.location.href}`);
                alert("คัดลอกคำทำนายเรียบร้อยแล้ว! นำไปส่งในแชทได้เลย");
            }
        }
    </script>
</body>
</html>
